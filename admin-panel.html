<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - College Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 College Notes</div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <button id="logoutBtn" class="nav-btn">🚪 Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="admin-layout">
            <!-- Sidebar -->
            <aside class="admin-sidebar">
                <h3>Admin Menu</h3>
                <ul>
                    <li><a href="#" class="sidebar-link active" data-tab="dashboard">📊 Dashboard</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="upload">📤 Upload Notes</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="manage">📋 Manage Notes</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="users">👥 Manage Users</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="reports">📈 Reports</a></li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main class="admin-main">
                <!-- Dashboard Tab -->
                <section id="dashboard" class="admin-tab active">
                    <h2>Dashboard</h2>
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <h4>Total Notes</h4>
                            <p id="totalNotes" class="stat-number">0</p>
                        </div>
                        <div class="stat-card">
                            <h4>Total Users</h4>
                            <p id="totalUsers" class="stat-number">0</p>
                        </div>
                        <div class="stat-card">
                            <h4>Total Downloads</h4>
                            <p id="totalDownloads" class="stat-number">0</p>
                        </div>
                        <div class="stat-card">
                            <h4>Active Users</h4>
                            <p id="activeUsers" class="stat-number">0</p>
                        </div>
                    </div>
                </section>

                <!-- Upload Notes Tab -->
                <section id="upload" class="admin-tab">
                    <h2>Upload Notes</h2>
                    <form id="uploadForm" class="upload-form">
                        <div class="form-group">
                            <label for="notesTitle">Notes Title</label>
                            <input type="text" id="notesTitle" required placeholder="Enter notes title">
                        </div>
                        <div class="form-group">
                            <label for="notesDescription">Description</label>
                            <textarea id="notesDescription" rows="4" placeholder="Enter notes description"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="notesCategory">Category</label>
                                <select id="notesCategory" required>
                                    <option value="">Select Category</option>
                                    <option value="cs">Computer Science</option>
                                    <option value="eng">Engineering</option>
                                    <option value="business">Business</option>
                                    <option value="science">Science</option>
                                    <option value="arts">Arts</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="courseCode">Course Code</label>
                                <input type="text" id="courseCode" placeholder="e.g., CS101">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="notesFile">Upload File (PDF, DOCX, PNG)</label>
                            <input type="file" id="notesFile" required accept=".pdf,.docx,.doc,.png,.jpg,.jpeg">
                        </div>
                        <button type="submit" class="btn btn-primary">📤 Upload Notes</button>
                        <div id="uploadMessage" class="message"></div>
                    </form>
                </section>

                <!-- Manage Notes Tab -->
                <section id="manage" class="admin-tab">
                    <h2>Manage Notes</h2>
                    <div class="search-container">
                        <input type="text" id="manageSearch" placeholder="Search notes..." class="search-input">
                    </div>
                    <div id="notesList" class="notes-table">
                        <!-- Notes will be loaded here -->
                    </div>
                </section>

                <!-- Manage Users Tab -->
                <section id="users" class="admin-tab">
                    <h2>Manage Users</h2>
                    <div class="search-container">
                        <input type="text" id="userSearch" placeholder="Search users..." class="search-input">
                    </div>
                    <div id="usersList" class="users-table">
                        <!-- Users will be loaded here -->
                    </div>
                </section>

                <!-- Reports Tab -->
                <section id="reports" class="admin-tab">
                    <h2>Reports</h2>
                    <div class="reports-section">
                        <div class="report-card">
                            <h4>Most Downloaded Notes</h4>
                            <ul id="topDownloads" class="report-list"></ul>
                        </div>
                        <div class="report-card">
                            <h4>Highest Rated Notes</h4>
                            <ul id="topRated" class="report-list"></ul>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
