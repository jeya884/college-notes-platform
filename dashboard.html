<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - College Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 College Notes</div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <button id="logoutBtn" class="nav-btn">🚪 Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-layout">
            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <h3>My Menu</h3>
                <ul>
                    <li><a href="#" class="sidebar-link active" data-tab="profile">👤 Profile</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="downloads">📥 My Downloads</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="uploads">📤 My Uploads</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="favorites">❤️ Favorites</a></li>
                    <li><a href="#" class="sidebar-link" data-tab="settings">⚙️ Settings</a></li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-main">
                <!-- Profile Tab -->
                <section id="profile" class="dashboard-tab active">
                    <h2>My Profile</h2>
                    <div class="profile-card">
                        <div class="profile-info">
                            <p><strong>Name:</strong> <span id="profileName"></span></p>
                            <p><strong>Email:</strong> <span id="profileEmail"></span></p>
                            <p><strong>Role:</strong> <span id="profileRole"></span></p>
                            <p><strong>Member Since:</strong> <span id="profileDate"></span></p>
                        </div>
                    </div>
                </section>

                <!-- Downloads Tab -->
                <section id="downloads" class="dashboard-tab">
                    <h2>My Downloads</h2>
                    <div id="downloadsList" class="notes-grid">
                        <!-- Downloads will be loaded here -->
                    </div>
                </section>

                <!-- Uploads Tab -->
                <section id="uploads" class="dashboard-tab">
                    <h2>My Uploads</h2>
                    <div id="uploadsList" class="notes-grid">
                        <!-- Uploads will be loaded here -->
                    </div>
                </section>

                <!-- Favorites Tab -->
                <section id="favorites" class="dashboard-tab">
                    <h2>My Favorites</h2>
                    <div id="favoritesList" class="notes-grid">
                        <!-- Favorites will be loaded here -->
                    </div>
                </section>

                <!-- Settings Tab -->
                <section id="settings" class="dashboard-tab">
                    <h2>Settings</h2>
                    <form id="settingsForm" class="settings-form">
                        <div class="form-group">
                            <label for="displayName">Display Name</label>
                            <input type="text" id="displayName" placeholder="Your display name">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password (leave empty to keep current)</label>
                            <input type="password" id="newPassword" placeholder="New password">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="notifEmail"> Email me about new notes in my categories
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">💾 Save Settings</button>
                        <div id="settingsMessage" class="message"></div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
