<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - College Notes Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">📚 College Notes</a>
        </div>
    </nav>

    <div class="container">
        <section class="auth-section">
            <div class="auth-card">
                <h1>Sign Up</h1>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="Create a password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" required placeholder="Confirm password">
                    </div>
                    <div class="form-group">
                        <label for="role">User Type</label>
                        <select id="role" required>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin (with verification)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">✍️ Sign Up</button>
                    <div id="signupMessage" class="message"></div>
                </form>
                <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
                <p class="auth-link"><a href="index.html">Back to Home</a></p>
            </div>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;

            if (password !== confirmPassword) {
                showMessage('signupMessage', 'Passwords do not match!', 'error');
                return;
            }

            try {
                await register(email, password, name, role);
                showMessage('signupMessage', 'Signup successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                showMessage('signupMessage', error.message, 'error');
            }
        });

        function showMessage(elementId, text, type) {
            const msg = document.getElementById(elementId);
            msg.textContent = text;
            msg.className = `message show ${type}`;
        }
    </script>
</body>
</html>
